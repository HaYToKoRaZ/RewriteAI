name: Release Extension Package

on:
  push:
    branches:
      - main
    paths:
      - 'main/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version from manifest.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./main/manifest.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Check if Tag Already Exists
        id: check_tag
        run: |
          git fetch --tags
          if git rev-parse "v${{ steps.get_version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.get_version.outputs.VERSION }} already exists."
          else
            echo "TAG_EXISTS=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.get_version.outputs.VERSION }} is new."
          fi

      - name: Create Extension ZIP Package
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        run: |
          mkdir -p dist
          cd main
          zip -r "../dist/RewriteAI-v${{ steps.get_version.outputs.VERSION }}-WebStore.zip" . -x "*.git*"
          cd ..
          ls -la dist/

      - name: Create GitHub Release
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.VERSION }}"
          name: "RewriteAI v${{ steps.get_version.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/RewriteAI-v${{ steps.get_version.outputs.VERSION }}-WebStore.zip
          body: |
            ## 🪄 RewriteAI v${{ steps.get_version.outputs.VERSION }}
            
            Multi-LLM Powered Smart Text Rewriter, Formatter & Tone Enhancer Browser Extension.
            
            ### 📥 Download & Manual Install
            1. Download the attached `RewriteAI-v${{ steps.get_version.outputs.VERSION }}-WebStore.zip` asset.
            2. Extract the ZIP file into a folder on your computer.
            3. Open your browser's extensions page:
               - **Chrome / Helium:** `chrome://extensions/`
               - **Edge:** `edge://extensions/`
            4. Enable **Developer Mode** in the top right.
            5. Click **Load unpacked** and select the extracted folder.
            
            ### 🌐 Official Website & Web Stores
            - [Website](https://haytokoraz.github.io/RewriteAI/)
            - [Chrome Web Store](https://chromewebstore.google.com/detail/rewriteai)
            - [Microsoft Edge Add-ons](https://microsoftedge.microsoft.com/addons/detail/rewriteai)
