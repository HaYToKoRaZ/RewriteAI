<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RewriteAI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrapper">

    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="../../assets/icons/icon32.png" alt="Logo" class="logo-small">
        <span class="brand-title">RewriteAI</span>
      </div>
      <div class="header-actions">
        <!-- Dil Seçici -->
        <div class="lang-selector" title="Dil / Language">
          <button class="lang-btn" id="langBtnTr" data-lang="tr">
            <span class="flag flag-tr"></span><span>TR</span>
          </button>
          <span class="lang-divider">|</span>
          <button class="lang-btn" id="langBtnEn" data-lang="en">
            <span class="flag flag-gb"></span><span>EN</span>
          </button>
        </div>
        <button id="openOptionsBtn" class="icon-btn" title="Ayarlar / Settings">⚙️</button>
      </div>
    </header>

    <!-- API Uyarısı -->
    <div id="apiAlert" class="alert-box hidden">
      <span id="apiAlertText">API anahtarınızı girmediniz.</span>
      <button id="goToOptionsBtn" class="link-btn" id="apiAlertBtn">Ayarla</button>
    </div>

    <!-- Model Seçici & Bilgi Çubuğu -->
    <div class="model-bar">
      <div class="model-bar-item">
        <label for="popupModelSelect" class="model-bar-label">AI Modeli:</label>
        <select id="popupModelSelect" class="popup-model-select" title="Yapay Zeka Modeli">
          <!-- Dinamik doldurulur -->
        </select>
      </div>
      <div class="model-bar-item lang-bar-item">
        <label for="popupTargetLangSelect" class="model-bar-label" id="lblTargetLang">Çıktı Dili:</label>
        <select id="popupTargetLangSelect" class="popup-model-select" title="Hedef Çıktı Dili">
          <option value="auto">🌐 Orijinal Dil (Oto)</option>
          <option value="tr">🇹🇷 Türkçe</option>
          <option value="en">🇬🇧 English</option>
        </select>
      </div>
    </div>

    <!-- API Anahtarı Eksik Uyarısı (Model bazlı) -->
    <div id="keyWarningBox" class="key-warning-box hidden">
      <span id="keyWarningText">⚠️ Bu model için API Anahtarı girilmemiş!</span>
      <button id="warningSettingsBtn" class="warning-settings-btn" type="button">⚙️ Ayarlara Git</button>
    </div>

    <!-- Ana İçerik -->
    <main class="main-content">

      <!-- Giriş Paneli -->
      <div class="text-panel">
        <div class="panel-header">
          <span id="inputPanelLabel">Orijinal Metin</span>
          <div class="panel-actions">
            <button id="pasteBtn" class="mini-btn" title="Panodan Yapıştır">📋 Yapıştır</button>
            <button id="clearBtn" class="mini-btn" title="Temizle">🗑️</button>
          </div>
        </div>
        <textarea id="inputText" placeholder="Metninizi buraya yazın veya yapıştırın..." spellcheck="false"></textarea>
      </div>

      <!-- Ton Seçim Izgarası (Açıklamasız, Temiz ve Şık 8 Buton) -->
      <div class="tone-grid-container">
        <div class="tone-grid">
          <button class="tone-card-btn active" data-tone="fix_grammar" type="button">
            <strong>✍️ İmla & Dilbilgisi</strong>
          </button>
          <button class="tone-card-btn" data-tone="daily" type="button">
            <strong>💬 Günlük & Samimi</strong>
          </button>
          <button class="tone-card-btn" data-tone="formal" type="button">
            <strong>💼 Resmi & Kurumsal</strong>
          </button>
          <button class="tone-card-btn" data-tone="slang" type="button">
            <strong>🔥 Argo & Sokak Ağzı</strong>
          </button>
          <button class="tone-card-btn" data-tone="academic" type="button">
            <strong>🎓 Akademik & Ağır</strong>
          </button>
          <button class="tone-card-btn" data-tone="gamer" type="button">
            <strong>🎮 Gamer</strong>
          </button>
          <button class="tone-card-btn" data-tone="techie" type="button">
            <strong>💻 Teknoloji Kurdu</strong>
          </button>
          <button class="tone-card-btn" data-tone="summarize" type="button">
            <strong>📌 Özetle</strong>
          </button>
        </div>
      </div>

      <!-- Çıktı Paneli -->
      <div class="text-panel output-panel">
        <div class="panel-header">
          <span id="outputPanelLabel">Dönüştürülen Metin</span>
          <div class="panel-actions">
            <button id="transformBtn" class="mini-btn execute-btn" title="Dönüştür">
              <span id="transformBtnText">⚡ Dönüştür</span>
              <div id="loader" class="mini-spinner hidden"></div>
            </button>
            <button id="copyBtn" class="mini-btn highlight-btn" title="Kopyala">📄 Kopyala</button>
          </div>
        </div>
        <textarea id="outputText" placeholder="Dönüştürülen metin burada belirecek..." readonly></textarea>
      </div>

    </main>

    <!-- Footer -->
    <footer class="popup-footer">
      <span id="charCount">0 karakter</span>
      <span id="statusInfo">Hazır</span>
    </footer>

  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
