<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RewriteAI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrapper">

    <!-- Header -->
    <header class="popup-header">
      <a href="https://haytokoraz.github.io/RewriteAI/" target="_blank" rel="noopener" class="brand" title="RewriteAI Web Sitesini Aç">
        <img src="../../assets/icons/icon32.png" alt="Logo" class="logo-small">
        <span class="brand-title">RewriteAI</span>
        <span class="brand-version" id="brandVersion">v2.2</span>
      </a>
      <div class="header-actions">
        <!-- Dil Seçici -->
        <div class="lang-selector" title="Dil / Language">
          <button class="lang-btn" id="langBtnTr" data-lang="tr">
            <span class="flag flag-tr"></span><span>TR</span>
          </button>
          <span class="lang-divider">|</span>
          <button class="lang-btn" id="langBtnEn" data-lang="en">
            <span class="flag flag-gb"></span><span>EN</span>
          </button>
        </div>
        <button id="openOptionsBtn" class="icon-btn" title="Ayarlar / Settings">⚙️</button>
      </div>
    </header>

    <!-- API Uyarısı -->
    <div id="apiAlert" class="alert-box hidden">
      <span id="apiAlertText">API anahtarınızı girmediniz.</span>
      <button id="goToOptionsBtn" class="link-btn">Ayarla</button>
    </div>

    <!-- Model Seçici & Bilgi Çubuğu -->
    <div class="model-bar">
      <div class="model-bar-item">
        <label for="popupModelSelect" class="model-bar-label">AI Modeli:</label>
        <select id="popupModelSelect" class="popup-model-select" title="Yapay Zeka Modeli">
          <!-- Dinamik doldurulur -->
        </select>
      </div>
      <div class="model-bar-item lang-bar-item">
        <label for="popupTargetLangSelect" class="model-bar-label" id="lblTargetLang">Çıktı Dili:</label>
        <!-- Gizli select (uyumluluk için korunur) -->
        <select id="popupTargetLangSelect" class="popup-model-select hidden-select" title="Hedef Çıktı Dili">
          <option value="auto">Orijinal Dil (Oto)</option>
        </select>
        <!-- Özel Bayraklı Açılır Menü -->
        <div class="custom-lang-dropdown" id="customLangDropdown">
          <button class="custom-dropdown-btn" id="customLangBtn" type="button" aria-expanded="false" title="Hedef Çıktı Dili">
            <span class="custom-dropdown-flag" id="customLangSelectedFlag"></span>
            <span class="custom-dropdown-text" id="customLangSelectedText">Orijinal</span>
            <span class="custom-dropdown-arrow">▾</span>
          </button>
          <div class="custom-dropdown-menu" id="customLangMenu">
            <!-- Dinamik doldurulur -->
          </div>
        </div>
      </div>
    </div>

    <!-- API Anahtarı Eksik Uyarısı (Model bazlı) -->
    <div id="keyWarningBox" class="key-warning-box hidden">
      <span id="keyWarningText">⚠️ Bu model için API Anahtarı girilmemiş!</span>
      <button id="warningSettingsBtn" class="warning-settings-btn" type="button">⚙️ Ayarlara Git</button>
    </div>



    <!-- Ana İçerik -->
    <main class="main-content">

      <!-- Giriş Paneli -->
      <div class="text-panel">
        <div class="panel-header">
          <span id="inputPanelLabel">Orijinal Metin</span>
          <div class="panel-actions">
            <button id="pasteBtn" class="mini-btn" title="Panodan Yapıştır">📋 Yapıştır</button>
            <button id="clearBtn" class="mini-btn" title="Temizle">🗑️</button>
          </div>
        </div>
        <textarea id="inputText" placeholder="Metninizi buraya yazın veya yapıştırın..." spellcheck="false"></textarea>
      </div>

      <!-- Ton Seçim Izgarası -->
      <!-- Ton Seçim Izgarası -->
      <div class="tone-grid-container">
        <div class="tone-grid">
          <!-- 1. Satır: İmla, Günlük, Resmi, Argo -->
          <button class="tone-card-btn active" data-tone="fix_grammar" type="button" title="✍️ İmla &amp; Dilbilgisi">
            <span class="tone-emoji">✍️</span>
            <strong>İmla</strong>
          </button>
          <button class="tone-card-btn" data-tone="daily" type="button" title="💬 Günlük &amp; Samimi">
            <span class="tone-emoji">💬</span>
            <strong>Günlük</strong>
          </button>
          <button class="tone-card-btn" data-tone="formal" type="button" title="💼 Resmi &amp; Kurumsal">
            <span class="tone-emoji">💼</span>
            <strong>Resmi</strong>
          </button>
          <button class="tone-card-btn" data-tone="slang" type="button" title="🔥 Argo &amp; Sokak Ağzı">
            <span class="tone-emoji">🔥</span>
            <strong>Argo</strong>
          </button>

          <!-- 2. Satır: Gamer, Tekno, Özetle, Diğerleri ▾ -->
          <button class="tone-card-btn" data-tone="gamer" type="button" title="🎮 Gamer">
            <span class="tone-emoji">🎮</span>
            <strong>Gamer</strong>
          </button>
          <button class="tone-card-btn" data-tone="techie" type="button" title="💻 Teknoloji Kurdu">
            <span class="tone-emoji">💻</span>
            <strong>Tekno</strong>
          </button>
          <button class="tone-card-btn" data-tone="summarize" type="button" title="📌 Özetle">
            <span class="tone-emoji">📌</span>
            <strong>Özetle</strong>
          </button>
          <button class="tone-card-btn tone-more-btn" id="moreTonesToggleBtn" type="button" title="Daha fazla ton seçeneği">
            <span class="tone-emoji" id="moreTonesBtnIcon">✨</span>
            <strong id="moreTonesBtnLabel">Diğerleri ▾</strong>
          </button>
        </div>

        <!-- Diğer Tonlar Çekmecesi (Drawer) -->
        <div class="more-tones-drawer" id="moreTonesDrawer">
          <div class="more-tones-list">
            <button class="more-tone-item" data-tone="academic" type="button">
              <span class="more-tone-icon">🎓</span>
              <div class="more-tone-info">
                <span class="more-tone-name">Akademik &amp; Ağır</span>
                <span class="more-tone-desc">Bilimsel terminoloji</span>
              </div>
            </button>
            <button class="more-tone-item" data-tone="diplomatic" type="button">
              <span class="more-tone-icon">🕊️</span>
              <div class="more-tone-info">
                <span class="more-tone-name">Nazik / Diplomatik Hayır</span>
                <span class="more-tone-desc">Zarifçe reddetme &amp; kırmama</span>
              </div>
            </button>
            <button class="more-tone-item" data-tone="marketing" type="button">
              <span class="more-tone-icon">🧲</span>
              <div class="more-tone-info">
                <span class="more-tone-name">Pazarlama &amp; Viral Hook</span>
                <span class="more-tone-desc">Sosyal medya &amp; dikkat çekici</span>
              </div>
            </button>
            <button class="more-tone-item" data-tone="eli5" type="button">
              <span class="more-tone-icon">💡</span>
              <div class="more-tone-info">
                <span class="more-tone-name">Basitleştir (5 Yaşında)</span>
                <span class="more-tone-desc">Herkesin anlayacağı sadelik</span>
              </div>
            </button>
            <button class="more-tone-item" data-tone="persuasive" type="button">
              <span class="more-tone-icon">🎯</span>
              <div class="more-tone-info">
                <span class="more-tone-name">İkna Edici &amp; Satış</span>
                <span class="more-tone-desc">Argüman ve fayda odaklı</span>
              </div>
            </button>
            <button class="more-tone-item" data-tone="creative" type="button">
              <span class="more-tone-icon">🎨</span>
              <div class="more-tone-info">
                <span class="more-tone-name">Yaratıcı Hikaye</span>
                <span class="more-tone-desc">Betimleyici ve akıcı kurgu</span>
              </div>
            </button>
            <button class="more-tone-item custom-tone-item" data-tone="custom" type="button">
              <span class="more-tone-icon">⚙️</span>
              <div class="more-tone-info">
                <span class="more-tone-name" id="drawerCustomToneName">Benim Tonum</span>
                <span class="more-tone-desc">Kişisel özel yönerge</span>
              </div>
              <span class="edit-custom-hint" id="editCustomHint" title="Ayarlardan Düzenle">⚙️</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Çıktı Paneli -->
      <div class="text-panel output-panel">
        <div class="panel-header">
          <div class="panel-header-left">
            <span id="outputPanelLabel">Dönüştürülen Metin</span>
            <div class="twitter-bar twitter-inline" id="twitterBar">
              <button id="twitterModeBtn" class="twitter-toggle" type="button" title="Twitter / X Modu (≤ 280 Karakter)">
                <span class="twitter-x-icon">𝕏</span>
                <span id="twitterModeLabel">X Modu</span>
              </button>
              <div class="toggle-pill" id="twitterTogglePill" title="Twitter / X Modunu Aç / Kapat">
                <div class="toggle-thumb"></div>
              </div>
            </div>
          </div>
          <div class="panel-actions">
            <button id="transformBtn" class="mini-btn execute-btn" title="Dönüştür">
              <span id="transformBtnText">⚡ Dönüştür</span>
              <div id="loader" class="mini-spinner hidden"></div>
            </button>
            <button id="copyBtn" class="mini-btn highlight-btn" title="Kopyala">📄 Kopyala</button>
          </div>
        </div>
        <textarea id="outputText" placeholder="Dönüştürülen metin burada belirecek..." readonly></textarea>
        <div class="output-char-bar" id="outputCharBar">
          <span id="outputCharCount">0 karakter</span>
        </div>
      </div>

    </main>

    <!-- Footer -->
    <footer class="popup-footer">
      <span id="charCount">0 karakter</span>
      <span id="statusInfo">Hazır</span>
    </footer>

  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
